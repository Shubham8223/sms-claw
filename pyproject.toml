[project]
name = "sms_claw"
version = "0.1.0"
description = "SMS-powered AI agent gateway — pluggable LLM, SMS providers, and tools"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Agent
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Validation & settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    # Cache
    "redis>=5.2.0",
    # HTTP
    "httpx>=0.28.0",
    # Security
    "cryptography>=44.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # SMS providers
    "twilio>=9.4.0",
    # Tools
    "aiosmtplib>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "PyGithub>=2.5.0",
    # Observability
    "structlog>=24.4.0",
    "rich>=13.9.0",
    # Resilience
    "tenacity>=9.0.0",
    "python-multipart>=0.0.22",
]

[project.scripts]
sms_claw = "sms_claw.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sms_claw"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "types-passlib>=1.7.7",
    "types-beautifulsoup4>=4.12.0",
    "watchfiles>=1.0.0",
    "faker>=33.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "T20"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["sms_claw"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=sms_claw --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src/sms_claw"]
omit = ["*/migrations/*", "*/tests/*"]
